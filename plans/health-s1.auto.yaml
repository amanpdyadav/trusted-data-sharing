schema_version: '1'
dataset: health
scenario_id: HEALTH-S1
created_at: '2026-11-06T22:32:01.033253Z'
k_target: 5
quasi_identifiers:
  ed_visits:
  - arrival_ts
  - municipality
  - age
record_keys:
  ed_visits: visit_id
  lab_results: lab_id
actions:
- table: ed_visits
  column: visit_id
  technique: pseudonymise
  params:
    length: 16
  reason: 'Row key as a keyed code: tables stay joinable, original numbers hidden.'
- table: ed_visits
  column: patient_hetu
  technique: pseudonymise
  params:
    length: 16
  reason: 'Requested link as a keyed code: repeat visits survive; reversal needs the
    key.'
- table: ed_visits
  column: patient_name
  technique: drop
  params: {}
  reason: person name identifies a person on its own.
- table: ed_visits
  column: date_of_birth
  technique: generalise
  params:
    to: age_band
    width: 10
    top: 80
    rename_to: age
    reference_column: arrival_ts
  reason: Age groups answer the questions; birth dates single people out.
- table: ed_visits
  column: sex
  technique: drop
  params: {}
  reason: Not in the data request (data minimisation).
- table: ed_visits
  column: phone
  technique: drop
  params: {}
  reason: phone identifies a person on its own.
- table: ed_visits
  column: home_address
  technique: drop
  params: {}
  reason: street address identifies a person on its own.
- table: ed_visits
  column: postcode
  technique: drop
  params: {}
  reason: Not in the data request (data minimisation).
- table: ed_visits
  column: municipality
  technique: keep
  params: {}
  reason: Requested; checked for k with the other quasi-identifiers.
- table: ed_visits
  column: arrival_ts
  technique: generalise
  params:
    to: time
    unit: time_of_day
  reason: 'Time released as time of day: exact times link to news, posts and receipts.'
- table: ed_visits
  column: arrival_mode
  technique: drop
  params: {}
  reason: Not in the data request (data minimisation).
- table: ed_visits
  column: ambulance_unit
  technique: drop
  params: {}
  reason: Link not in the data request (data minimisation).
- table: ed_visits
  column: triage
  technique: keep
  params: {}
  reason: Requested sensitive fact; kept, its link to a person is broken.
- table: ed_visits
  column: chief_complaint
  technique: drop
  params: {}
  reason: Free text can name anyone; withheld until text redaction is in place.
- table: ed_visits
  column: icd10_primary
  technique: generalise
  params:
    to: truncate
    length: 3
  reason: 3-character codes keep diagnosis groups; rare sub-codes single people out.
- table: ed_visits
  column: icd10_secondary
  technique: drop
  params: {}
  reason: Not in the data request (data minimisation).
- table: ed_visits
