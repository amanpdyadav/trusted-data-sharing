- table: lab_results
  column: lab_id
  technique: pseudonymise
  params:
    length: 16
  reason: 'Row key as a keyed code: tables stay joinable, original numbers hidden.'
- table: lab_results
  column: visit_id
  technique: pseudonymise
  params:
    length: 16
  reason: 'Same keyed code as the linked table''s row key: the join survives.'
- table: lab_results
  column: test_code
  technique: keep
