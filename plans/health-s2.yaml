      to: code_group
      groups:
        J09: ILI
        J10: ILI
        J11: ILI
        J06: ILI
        U07: ILI
        J21: RSV
        I: cardiovascular
        J: respiratory
        S: injury
        T: injury
        F: mental_health
        G: neurological
        N: urological
        K: gastrointestinal
        A: gastrointestinal
        O: pregnancy
        E: endocrine
        M: musculoskeletal
        L: skin
        H: other_infection
        R: other
        Z: other
        R07: cardiovascular
        R51: neurological
        R10: gastrointestinal
        R50: other_infection
        F10: intoxication
        T78: allergy
        T63: allergy
        A41: infection_severe
        I63: neurological
      default: other
    name: diagnosis_group
    domain:
    - ILI
    - RSV
    - allergy
    - cardiovascular
    - endocrine
    - gastrointestinal
    - infection_severe
    - injury
    - intoxication
    - mental_health
    - musculoskeletal
    - neurological
    - other
    - other_infection
    - pregnancy
    - respiratory
    - skin
    - urological
  measure:
    kind: count
    lower: 0.0
    values: []
  exclude:
    disposition:
    - cancelled_duplicate
  epsilon: 0.25
  reason: count by week, diagnosis_group; epsilon 0.25 of the release; one person
    = one patient_hetu.
