schema_version: '1'
id: CYBER-S1
dataset: cyber
title: Outsource 24/7 monitoring to an external MSSP
recipient: Managed security service provider under a data processing agreement
purpose: Detect and investigate threats across sign-in, VPN, proxy, DNS, EDR and e-mail telemetry
trust_level: contractual
threat_model: Curious MSSP analyst with company_website_staff.csv (public) and general OSINT; may try to learn who
  is who or what employees browse.
legal_context: Processor under GDPR Art. 28; pseudonymised data is still personal data. Employee monitoring must
  be proportionate (in Finland, the Act on the Protection of Privacy in Working Life).
